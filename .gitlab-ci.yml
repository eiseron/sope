include:
  - project: eiseron/stack/ci
    file: /templates/go.yml
    ref: v0.1.13
  - project: eiseron/stack/ci
    file: /templates/release.yml
    ref: v0.1.13
  - project: eiseron/stack/ci
    file: /templates/sync-github.yml
    ref: v0.1.13

stages:
  - lint
  - test
  - release
  - build
  - sync

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  tags:
    - self-hosted

integration:
  stage: test
  image: registry.gitlab.com/eiseron/stack/public-image-bases/go-tools:v0.1.7
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOTOOLCHAIN: local
    GOFLAGS: -buildvcs=false
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    - key:
        files:
          - go.sum
      paths:
        - .cache/
  script:
    - go test -tags=integration ./...

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.21.1-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - AUTH_B64=$(printf "%s:%s" "gitlab-ci-token" "$CI_JOB_TOKEN" | base64 | tr -d '\n')
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH_B64\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --push-retry=3

binaries:
  stage: build
  image:
    name: goreleaser/goreleaser:v2.16.0
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GITLAB_TOKEN: $EISERON_STACK_TOKEN
    GITHUB_TOKEN: ""
    GIT_DEPTH: "0"
  script:
    - goreleaser release --clean
